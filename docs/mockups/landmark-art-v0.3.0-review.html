<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>臺北 101｜模型美術 v0.3.0 新舊比較</title><style>*{box-sizing:border-box}body{margin:0;background:#edf2f1;color:#183c49;font:16px/1.7 system-ui,sans-serif}main{max-width:1500px;margin:auto;padding:30px 24px}h1{font-size:clamp(25px,4vw,36px);margin:8px 0}p{max-width:850px}section{display:grid;grid-template-columns:1fr 1fr;gap:24px}figure{margin:0}img{width:100%;height:auto;display:block;border:1px solid #bdcece;border-radius:8px}figcaption{padding:10px 0;font-size:14px}h2{font-size:19px}a{color:#1a6384}a.button{display:inline-block;background:#234d64;color:#fff;padding:12px 20px;border-radius:7px;text-decoration:none;margin:10px 0 22px}.mobile{max-width:390px}small{color:#4a6c77}a:focus-visible{outline:3px solid #177bd0;outline-offset:4px}@media(max-width:760px){section{grid-template-columns:1fr}main{padding:20px 16px}}</style><main><small>台北安可・政策市／獨立美術驗證</small><h1>從簡化量體，到專屬地標資產。</h1><p>以 Blender 重新建立臺北 101 的辨識結構，匯出 GLB，在現有 Three.js 城市內實際呈現。以下比較使用相同鏡頭與光照，未以生成圖片代替成品。</p><a class="button" href="../landmark-art-v0.3.0.html?detail=facade">開啟 3D 新舊切換 →</a><section><figure><h2>新模型｜實際 3D 截圖</h2><img src="landmark-v030-facade.png" alt="新地標八節塔身的玻璃與窗框近景"><figcaption>逐層窗框、玻璃、金屬分格、轉折與裝飾細節。</figcaption></figure><figure><h2>原模型｜相同鏡頭</h2><img src="landmark-v030-original.png" alt="原本簡化臺北101模型的相同視角"><figcaption>原模型保留在預覽內，可即時切換。</figcaption></figure></section><section><figure><h2>地標全貌</h2><img src="landmark-v030-full.png" loading="lazy" alt="新地標全貌與既有城市"></figure><figure><h2>地面商場</h2><img src="landmark-v030-podium.png" loading="lazy" alt="裙樓入口與商場近景"></figure></section><h2>手機實際畫面</h2><img class="mobile" src="landmark-v030-mobile.png" loading="lazy" alt="手機上的新地標模型預覽"><p><small>此版先驗收地標模型；全市建築與真實行政地理尚未重建。正式站與 v0.2.0 保持原樣。模型是美術重建，非建築測繪。</small></p></main></html>
