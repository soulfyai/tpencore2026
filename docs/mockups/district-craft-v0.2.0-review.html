<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>街區美術 v0.2.0｜生成方向與實際 3D 對照</title><style>*{box-sizing:border-box}body{margin:0;background:#eef2ef;color:#203b49;font:16px/1.7 system-ui,sans-serif}main{max-width:1500px;margin:auto;padding:32px 24px}h1{font-size:clamp(24px,4vw,36px);margin:8px 0}p{max-width:850px}a{color:#175780}a.button{display:inline-block;background:#254e64;color:#fff;text-decoration:none;padding:12px 20px;border-radius:7px;margin:8px 0 24px}section{display:grid;grid-template-columns:1fr 1fr;gap:24px}figure{margin:0}img{width:100%;height:auto;display:block;border:1px solid #cbd8d8;border-radius:8px}figcaption{font-size:14px;padding:12px 0}h2{font-size:19px}small{color:#496473}.mobile{max-width:390px}a:focus-visible{outline:3px solid #177bd0;outline-offset:4px}@media(max-width:760px){section{grid-template-columns:1fr}main{padding:20px 16px}}</style><main><small>台北安可・政策市／獨立美術研究</small><h1>街區美術 v0.2.0</h1><p>在現有臺北托育政策基地內，實作退台親子館、弧形繪本室、連棟商店及湖岸拱橋。以下右圖是網頁實際渲染；本次只改一個街區，周邊城市仍是既有模型。</p><a class="button" href="../district-craft-v0.2.0.html">開啟可旋轉 3D 預覽 →</a><section><figure><h2>生成 mockup｜美術方向參考</h2><img src="craft-v2-direction.png" alt="先前生成的城市與聊天入口概念圖"><figcaption>作為建築多樣性、景觀層次與氛圍參考。不是實際 3D 成品；圖中政府網址為生成誤植，本站是 tpencore.tw。</figcaption></figure><figure><h2>實際網頁｜v0.2.0 街區</h2><img src="craft-v2-desktop.png" alt="實際 WebGL 渲染的湖岸親子街區"><figcaption>原有介面、Logo、道路及島形保留。這是局部美術樣板，尚未宣稱達到生成圖的全市細緻度。</figcaption></figure></section><section><figure><h2>實際網頁｜反向觀看</h2><img src="craft-v2-rear.png" loading="lazy" alt="同一個街區從背面觀看的實際截圖"></figure><figure><h2>實際網頁｜手機</h2><img class="mobile" src="craft-v2-mobile.png" loading="lazy" alt="手機直式視角實際截圖"></figure></section><p><small>獨立預覽・未替換正式網站美術。店名與街景為示意，非真實商家或實際地籍復原。</small></p></main></html>
