<!doctype html><html><head><meta charset="utf-8"><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script></head><body><script type="module">
import * as THREE from 'three';
import {createTaipeiCityPlan} from '../prototypes/taipei-city-layout.js';
import {createTaipeiRoads} from '../prototypes/taipei-city-roads.js';
const data=await(await fetch('../prototypes/taipei-preview-data.json')).json(),city=createTaipeiCityPlan(data),renderer=new THREE.WebGLRenderer({antialias:false});renderer.setSize(900,1400);document.body.append(renderer.domElement);const target=new THREE.WebGLRenderTarget(900,1400),camera=new THREE.PerspectiveCamera(40,900/1400,4,4200),old=new THREE.Scene(),fixed=new THREE.Scene();
const asphalt=new THREE.MeshBasicMaterial({color:'#38434b'}),pavement=new THREE.MeshBasicMaterial({color:'#d7d3c4'}),grass=new THREE.MeshBasicMaterial({color:'#74925e'});
for(const scene of [old,fixed]){const plane=new THREE.Mesh(new THREE.PlaneGeometry(1800,1800),grass);plane.rotation.x=-Math.PI/2;plane.position.y=.01;scene.add(plane);}
for(const r of city.roads){const x=(r.a[0]+r.b[0])/2,z=(r.a[1]+r.b[1])/2,length=Math.hypot(r.b[0]-r.a[0],r.b[1]-r.a[1]),width=r.pedestrian?2.8:4.8;for(const [material,y,h,w,d] of [[pavement,.075,.14,r.horizontal?length+1:width+1.9,r.horizontal?width+1.9:length+1],[r.pedestrian?pavement:asphalt,.125,.06,r.horizontal?length+.15:width,r.horizontal?width:length+.15]]){const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);mesh.position.set(x,y,z);old.add(mesh);}}
const surface=createTaipeiRoads({asphalt,pavement,mat:c=>new THREE.MeshBasicMaterial({color:c})},fixed,renderer,city.roads),raycaster=new THREE.Raycaster(),plane=new THREE.Plane(new THREE.Vector3(0,1,0),-.12),pixel=new THREE.Vector3(),buffer=new Uint8Array(900*1400*4);
const points=[];for(const r of city.roads.filter(r=>!r.pedestrian))for(const t of [.42,.58])for(const side of [-1,1]){const x=r.a[0]+(r.b[0]-r.a[0])*t+(r.horizontal?0:side),z=r.a[1]+(r.b[1]-r.a[1])*t+(r.horizontal?side:0);points.push(new THREE.Vector3(x,.12,z));}
function safe(x,z){return surface.plan.faces.some(f=>f.kind===2&&x>f.x0+.5&&x<f.x1-.5&&z>f.z0+.5&&z<f.z1-.5)&&!surface.plan.markings.some(m=>Math.abs(x-m.x)<m.w/2+.7&&Math.abs(z-m.z)<m.d/2+.7);}
function sweep(scene,near){let samples=0,white=0;for(let frame=0;frame<8;frame++){camera.near=near;camera.position.set(600+frame*.6,950,680-frame*.5);camera.lookAt(-30,0,-25);camera.updateProjectionMatrix();camera.updateMatrixWorld();renderer.setRenderTarget(target);renderer.render(scene,camera);renderer.readRenderTargetPixels(target,0,0,900,1400,buffer);for(const point of points){const p=point.clone().project(camera),x=Math.floor((p.x+1)*450),y=Math.floor((p.y+1)*700);if(x<1||x>=899||y<1||y>=1399)continue;raycaster.setFromCamera(new THREE.Vector2((x+.5)/450-1,(y+.5)/700-1),camera);raycaster.ray.intersectPlane(plane,pixel);if(!safe(pixel.x,pixel.z))continue;const i=(y*900+x)*4;samples++;if((buffer[i]+buffer[i+1]+buffer[i+2])/3>100)white++;}}return {samples,white};}
window.ROAD_DEPTH_TEST={run(){const baseline=sweep(old,4),geometry=sweep(fixed,4),precision=sweep(fixed,40);return {baseline,geometry,precision};}};document.documentElement.dataset.ready='true';
</script></body></html>
