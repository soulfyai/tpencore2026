<style>
/* Layout: one-screen map app — hex atlas on the left, reading panel on the right; stacks on phones */
:root{
  --paper:#EEF2F8; --surface:#FBFCFE; --sunk:#E1E8F2; --ink:#14213D; --muted:#55627A; --line:#C8D2E2;
  --route:#B5122B;
  --c-taipei:#1F4FB8; --c-newtaipei:#11A09D; --c-keelung:#23336E; --c-taoyuan:#E0523A;

  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --hex-mix:20%;
}

  --paper:#0E1424; --surface:#151D31; --sunk:#0A0F1C; --ink:#E6ECF7; --muted:#9AA8C2; --line:#2A3654;
  --route:#F05A6E;
  --c-taipei:#6F9BF2; --c-newtaipei:#3FD1C9; --c-keelung:#A9B8F0; --c-taoyuan:#F58A6E;
  --hex-mix:26%; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1424; --surface:#151D31; --sunk:#0A0F1C; --ink:#E6ECF7; --muted:#9AA8C2; --line:#2A3654;
  --route:#F05A6E;
  --c-taipei:#6F9BF2; --c-newtaipei:#3FD1C9; --c-keelung:#A9B8F0; --c-taoyuan:#F58A6E;
  --hex-mix:26%; color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;gap:12px;padding-block:14px}
header.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:8px 20px}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,3.2vw,34px);line-height:1.15;margin:0;letter-spacing:.02em;text-wrap:balance}
.brand h1 .subbrand{display:block;font-family:var(--f-body);font-weight:700;font-size:clamp(12px,1.4vw,14px);letter-spacing:.28em;color:var(--muted);margin-top:2px}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.notice{font-size:12.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--surface)}
.notice b{color:var(--ink);font-weight:700}
.main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,420px);gap:14px}
.mapwrap{position:relative;min-width:0;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.maptools{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:center}
.chip{font:500 13px/1 var(--f-body);border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip:focus-visible,button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--route);outline-offset:2px}
.spacer{flex:1}
svg.map{flex:1;min-height:0;width:100%;display:block;touch-action:manipulation}
.hex{cursor:pointer}
.hex polygon{fill:color-mix(in srgb,var(--c) var(--hex-mix),var(--surface));stroke:var(--surface);stroke-width:2;transition:fill .15s}
.hex:hover polygon,.hex:focus polygon{fill:color-mix(in srgb,var(--c) calc(var(--hex-mix) + 18%),var(--surface))}
.hex.sel polygon{fill:var(--c)}
.hex.sel text{fill:var(--surface)}
.hex.dim{opacity:.22}
.hex.record polygon{fill:var(--hatch);stroke:var(--c);stroke-dasharray:4 3;stroke-width:1.6}
.hex.record.sel polygon{fill:var(--c);stroke-dasharray:none}
.hex.hit polygon{stroke:var(--route);stroke-width:3}
.hex:focus{outline:none}
.hex:focus-visible polygon{stroke:var(--ink);stroke-width:3}
.hex text{fill:var(--ink);font-family:var(--f-body);font-size:11.5px;font-weight:700;text-anchor:middle;pointer-events:none}
.hex text.code{font-family:var(--f-mono);font-weight:500;font-size:8.5px;fill:var(--muted)}
.hex.sel text.code{fill:var(--surface);opacity:.8}
.border{stroke:var(--c);stroke-width:2.6;stroke-linecap:round;fill:none;pointer-events:none}
.citylabel{font-family:var(--f-display);font-weight:800;font-size:17px;fill:var(--c);paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round;pointer-events:none}
.citylabel tspan.cand{font-family:var(--f-body);font-weight:500;font-size:11px;fill:var(--ink)}
.flow{fill:none;stroke:var(--route);stroke-width:1.8;opacity:.38;cursor:pointer}
.flow.tier-news{stroke-dasharray:7 5}
.flow.tier-interview{stroke-dasharray:1.5 5;stroke-linecap:round}
.flow:hover,.flow.on{opacity:1;stroke-width:3.4}
.flowhit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
.flowdot{fill:var(--route)}
.flows-off .flowlayer g{display:none}.flows-off .flowlayer g.picked{display:inline}
.flows-off .legend{display:none}.legend{position:absolute;left:12px;bottom:10px;font-size:11.5px;color:var(--muted);background:color-mix(in srgb,var(--surface) 88%,transparent);padding:6px 10px;border-radius:8px;display:flex;gap:12px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend svg{width:26px;height:6px}
/* panel */
.panel{min-width:0;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;font:500 13.5px var(--f-body);background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:11px 6px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:700}
.pbody{flex:1;min-height:0;overflow:auto;padding:16px 18px 22px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h2.title{font-family:var(--f-display);font-weight:800;font-size:23px;line-height:1.25;margin:4px 0 8px;text-wrap:balance}
h3.sec{font-size:12.5px;letter-spacing:.06em;color:var(--muted);font-weight:700;margin:20px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
.lede{margin:0 0 6px;max-width:62ch}
.vision{margin:8px 0;padding:8px 12px;border-left:3px solid var(--c,var(--ink));background:var(--paper);font-family:var(--f-display);font-weight:600;border-radius:0 8px 8px 0}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.pill{font-size:12px;border-radius:999px;padding:2px 10px;background:var(--paper);border:1px solid var(--line);color:var(--muted)}
.pill.city{background:color-mix(in srgb,var(--c) 18%,var(--surface));border-color:transparent;color:var(--ink)}
.pill.t-official{color:var(--ink);border-color:var(--ink)}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 2px;font:inherit;color:inherit;cursor:pointer}
.row:hover{background:var(--paper)}
.row .no{font-family:var(--f-mono);font-size:11px;color:var(--muted);min-width:2.4em}
.row .nm{font-weight:500;min-width:0}
.row .sub{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
.row .go{color:var(--muted)}
.facts{margin:0;padding-left:1.1em}
.facts li{margin:3px 0}
.kv{display:grid;grid-template-columns:5.5em 1fr;gap:4px 10px;font-size:14px;margin:8px 0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0}
.src{display:flex;flex-direction:column;gap:8px}
.src a{color:var(--ink);text-decoration:none;display:block;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper)}
.src a:hover{border-color:var(--ink)}
.src small{display:block;color:var(--muted);font-size:12px}
.back{font:500 13px var(--f-body);background:none;border:0;color:var(--muted);cursor:pointer;padding:0;margin-bottom:8px}
.cands{display:grid;gap:10px}
.cand{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;text-align:left;font:inherit;color:inherit;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:10px 12px;cursor:pointer}
.cand:hover{border-color:var(--c)}
.cand .cn{font-family:var(--f-display);font-weight:800;font-size:19px}
.cand .ct{font-size:12.5px;color:var(--muted)}
.cand .stats{grid-column:1/-1;font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.search{width:100%;font:inherit;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--paper);color:var(--ink);margin-bottom:10px}
details.grp{border-bottom:1px solid var(--line)}
details.grp>summary{list-style:none;cursor:pointer;padding:10px 2px;display:flex;gap:8px;align-items:center;font-weight:700}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary i{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
details.grp>summary .cnt{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:400}
details.grp .rows{padding-left:18px}
.flowitem{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 2px;cursor:pointer}
.flowitem:hover{background:var(--paper)}
.flowitem b{font-family:var(--f-mono);font-size:12px;color:var(--route);margin-right:6px}
.flowitem .sub{display:block;font-size:12.5px;color:var(--muted)}
.method p{margin:0 0 10px;max-width:62ch}
.quote{font-family:var(--f-display);font-weight:600}
.empty{color:var(--muted)}
.dots{display:inline-flex;gap:4px;vertical-align:middle}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--c)}
@media (max-width:860px){
  html,body{height:auto}

  .legend{position:static;margin:0 12px 10px}

  .tabs button{min-height:44px}
  .back{min-height:40px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

, "若施工受一樓既存違建阻礙，市府將優先專案拆除。"], "sources": ["tpr-s12"]}, {"name": "南港機廠社宅完工入住", "area": "住宅都更", "plain": "南港機廠1區社宅（2棟27層、1,442戶）完工，2025年底起分批入住；同區2區288戶於2025年12月動工。", "facts": ["蔣萬安稱任內前3年社宅開工近1,500戶、完工近4,800戶。", "民眾黨議員黃瀞瑩2023年質疑市府社宅新規劃戶數不足，蔣萬安則認為應以相同標準比較前後任市府。"], "sources": ["tpr-s13", "tpr-s14"]}, {"name": "家戶廚餘收運改制", "area": "環保", "plain": "配合中央禁止家戶廚餘養豬，台北市自2026年1月1日起廚餘不再分紅藍桶，一律倒入藍桶改作堆肥。", "sources": ["tpr-s15"]}, {"name": "智慧災害應變平台上線", "area": "治安消防", "plain": "台北市「智慧災害應變雲端協作平台」（T-SAGE）2026年正式上線，結合雲端與AI，讓災害應變中心可行動化協作。", "facts": ["消防局另導入AI語音系統，於報案時辨識到院前心肺停止與火警關鍵字。", "報導指出火災死亡率、救護反應時間、防災士比例三項指標居六都之冠。"], "sources": ["tpr-s16"]}, {"name": "成立北捷遊憩公司", "area": "文化觀光", "plain": "市府於2025年7月1日成立北捷遊憩公司，首批接手貓空纜車、台北小巨蛋與兒童新樂園的營運管理。", "sources": ["tpr-s17"]}, {"name": "雙北世界壯年運動會", "area": "體育", "plain": "台北市與新北市合辦2025世界壯年運動會，2025年5月17日於台北大巨蛋開幕，共35種運動。", "facts": ["報導稱有107國、超過2.5萬名選手及隨行人員參加，參與人數為該賽事史上第三高。"], "sources": ["tpr-s18", "tpr-s19"]}, {"name": "動物園門票調整", "area": "文化觀光", "plain": "台北市立動物園自2024年4月1日起調整門票，非市民全票由60元調為100元，市民維持60元，為1997年以來首次調整。", "facts": ["園方預估年增約4,100萬元收入，用於展場改善與動物福利。"], "sources": ["tpr-s20"]}, {"name": "信義老服日照中心遷建", "area": "社福", "plain": "信義老人服務暨日照中心2023年6月19日遷入廣慈博愛園區，日照收托量由24人增至120人，並試辦3床夜間喘息。", "sources": ["tpr-s21"]}, {"name": "電動公車充電場啟用", "area": "環保", "plain": "北投機廠電動公車共享充電場2025年7月2日啟用，設11支充電樁、22個充電位；當時台北市電動公車約897輛。", "facts": ["台北市2021年起已停止購入燃油大客車，此項延續前任政策。"], "sources": ["tpr-s22"]}, {"name": "癌症病人凍卵補助", "area": "衛生", "plain": "台北市自2024年起試辦，補助設籍、未滿40歲且經醫師評估癌症治療可能影響生育力的女性凍卵，一生一次、最高3.2萬元。", "facts": ["報導稱台北市為全國第一個提供此項補助的縣市。"], "sources": ["tpr-s23"]}, {"name": "以里為單位行人友善", "area": "交通", "plain": "市府以里為單位推動行人友善改善，報導截至2026年9月已完成5個里、84個里報名；大學里2025年改為限速20公里的行人優先區。", "facts": ["交通局稱2025年市政滿意度調查中有75.7%市民肯定行人改善。", "民進黨議員批評標線型人行道劃設缺乏整體規劃；交通工程學者劉冠頡認為部分生活道路宜採人車共用，市府則傾向逐步改為實體人行道。"], "sources": ["tpr-s24", "tpr-s25"]}], "crossCity": [{"text": "萬大線連結台北中正、萬華與新北永和、中和、土城，蔣萬安與侯友宜共同試乘，第一期最快2027年底完工。", "with": ["newtaipei"], "sources": ["tp-s19"]}, {"text": "回應李四川「校校有公托」，表示雙北是共同生活圈，將攜手減輕育兒負擔。", "with": ["newtaipei"], "sources": ["tp-s25"]}, {"text": "松山機場遷移後的運量由桃園機場第三航廈與第三跑道承接；台北AI園區規劃與新北、桃園、新竹等8縣市科技廊帶串聯。", "with": ["newtaipei", "taoyuan", "hsinchu"], "sources": ["tp-s4"]}, {"text": "競總成立大會由北北基宜桃竹6縣市串聯，展現跨縣市合作願景。", "with": ["newtaipei", "keelung", "yilan", "taoyuan", "hsinchu"], "sources": ["tp-s2"]}], "unknowns": ["截至2026-10-22未找到正式的連任政見白皮書；數位時代2026-10-06報導指其尚未發布完整連任政見，多數項目為市府任內宣布、延續至下一任期的計畫。", "未找到候選人官方競選網站或官方臉書的政見頁面，所有來源皆為媒體報導。", "松山機場遷移與台北AI園區未提出完成時程，交通部表示需從國家角度整體評估。", "都更門檻降至50%與大街廓容積300%未說明生效日期，也未說明是否需修法或議會程序。", "捷運「六線齊發」各線名稱與完工時程，來源未逐一列出。", "國中小午餐免費、臨托券、國中鮮奶等原定2026年9月上路的措施，本次未查證實際執行狀況。", "托育補助金額、RSV疫苗補助內容、登記時提到的「三年計畫」內容，來源均未說明。", "長照（日照、失智照護、居家服務）方面，未找到蔣萬安本人提出的具體連任政見。", "未找到社會住宅興建目標的2026年連任承諾。", "電視政見發表會與辯論尚未舉行或未查得內容（雙方仍在協商場次）。"], "recordShown": true}, {"city": "newtaipei", "cityName": "新北市", "candidate": "李四川", "party": "中國國民黨（藍白共推）", "status": "參選人", "slogan": "", "sources": [{"id": "nt-s1", "url": "https://www.ettoday.net/news/20260607/3179239.htm", "title": "李四川拋交通政見 承諾當選後力推汐止直通信義區、動物園", "publisher": "ETtoday新聞雲", "date": "2026-06-07", "checkedAt": "2026-10-22", "tier": "news"}, {"id": "nt-s2", "url": "https://udn.com/news/story/124652/9653165", "title": "布局新北未來30年 李四川提「南有巨蛋城、北有科學城」雙引擎", "publisher": "聯合報", "date": "2026-07-27", "checkedAt": "2026-10-22", "tier": "news"}, {"id": "nt-s3", "url": "https://udn.com/news/story/124652/9507230", "title": "打造雙北30分鐘生活圈 李四川高喊：新北要成為最有希望城市", "publisher": "聯合報", "date": "2026-05-16", "checkedAt": "2026-10-22", "tier": "news"}, {"id": "nt-s4", "url": "https://udn.com/news/story/124652/9602986", "title": "李四川今公布三大教育政策 打造AI教育城市提升師生權益", "publisher": "聯合報", "date": "2026-07-02", "checkedAt": "2026-10-22", "tier": "news"}, {"id": "nt-s5", "url": "https://cna.com.tw/news/aloc/202610030114.aspx", "title": "李四川提大漢溪捷運縱貫線、AI科技產業廊帶政見", "publisher": "中央社", "date": "2026-10-03", "checkedAt": "2026-10-22", "tier": "news"}, {"id": "nt-s6", "url": "https://udn.com/news/story/124652/9389587", "titl 社福", "plain": "市府於2024年1月1日成立婦幼發展局，把原分屬社會局與衛生局的婦女、托育、早療與婦幼健康業務整併由單一局處辦理。", "facts": ["首任局長稱為全國第一個以婦幼為名的一級局處。"], "sources": ["tyr-s8"]}, {"name": "50歲以上皮蛇疫苗補助", "area": "衛生", "plain": "2025年7月起，設籍桃園、年滿50歲並完成流感與新冠疫苗、簽署預立醫療決定者，第二劑帶狀皰疹疫苗由市府補助；中低收入戶兩劑全補助。", "facts": ["衛生局稱至2026年3月已補助679劑；2026年1月起推出團體諮商，每人500元。", "市議員于北辰對須先自費簽署預立醫療決定的條件有不同意見，認為諮商費用抵銷補助效果；張善政稱預立醫療是終身決定，不應算作疫苗成本。"], "sources": ["tyr-s9", "tyr-s10"]}, {"name": "2歲專班增至200班", "area": "教育", "plain": "公立及非營利幼兒園2歲專班在114學年度達200班，三年增加123班；中壢興南非營利幼兒園於2025年8月1日開園。", "facts": ["興南幼兒園總經費約1.2億元，教育部負擔約三分之二。"], "sources": ["tyr-s11"]}, {"name": "生質能中心營運", "area": "環保", "plain": "以BOT興建的桃園生質能中心可處理熟廚餘，2023年啟用，2025年初轉入正式營運。", "facts": ["設計日處理量135公噸，報導列現行量能每日74.7公噸。", "桃園市審計處曾指出運轉量偏低，2024年處理量約僅設計量兩成；市府與業者稱已調整改善。"], "sources": ["tyr-s12", "tyr-s13"]}, {"name": "欣榮焚化廠整改完成", "area": "環保", "plain": "欣榮焚化廠於2024年底完成整改，市府稱兩座焚化廠已有每日約100公噸餘裕，轉用於清運掩埋場裸露垃圾。", "facts": ["環保局稱全市約5.8萬噸裸露垃圾預定2026年底前清完，此部分尚在進行中。"], "sources": ["tyr-s13"]}, {"name": "大仁滯洪池啟用", "area": "工務水利", "plain": "八德大仁滯洪池於2026年3月9日啟用，可蓄洪約13.4萬立方公尺，平時作休憩空間。", "facts": ["總經費8.32億元，中央前瞻計畫補助5.11億元；官方稱可使周邊近100公頃免於淹水威脅。"], "sources": ["tyr-s14"]}, {"name": "廣達公園共融改造", "area": "工務水利", "plain": "平鎮廣達公園投入逾2,000萬元更新共融遊戲場與休憩設施，於2026年6月5日啟用。", "facts": ["旁邊籃球場已整修完成，鄰近婦幼館仍在施工。"], "sources": ["tyr-s15"]}, {"name": "北橫觀光接駁車", "area": "文化觀光", "plain": "風景區管理處自2026年7月4日起於假日開行免費北橫接駁車，串聯角板山、小烏來與羅浮。", "facts": ["營運首4日服務575人次。"], "sources": ["tyr-s16"]}, {"name": "航空城博物館05開放", "area": "文化觀光", "plain": "由舊空軍基地05警戒區機庫改設的航空城博物館展區，於2025年7月以「風起05」展覽試營運開放。", "facts": ["文化局稱三年內完成10處文化場館活化或新設，包括中原文創園區、憲光二村與航空城博物館。"], "sources": ["tyr-s17", "tyr-s18"]}, {"name": "招商投資金額", "area": "產業", "plain": "張善政稱桃園年度投資金額2023年為2,009億元、2024年為2,302億元，並稱投資台灣三大方案金額連續三年全國第一。", "facts": ["上述數字為市長受訪說法，報導未附獨立查證。"], "sources": ["tyr-s19"]}, {"name": "市民卡APP 2.0", "area": "數位", "plain": "市民卡APP下架改版後重新上架，至2026年4月已逾一年，整合停車繳費等功能。", "facts": ["市府稱下載34萬次、活躍用戶約23萬人，透過APP繳停車費累計37萬次。", "多位不同黨籍市議員對APP成效有不同意見，指出無效連結多、下載量遠低於台北通、未解決一人多卡問題。"], "sources": ["tyr-s20"]}, {"name": "救護一路通", "area": "治安消防", "plain": "消防局與交通局自2023年底起以智慧號誌讓救護車接近責任醫院時沿途轉綠燈，已在聖保祿、部立桃園、敏盛三處醫院周邊實施。", "facts": ["張善政稱至2026年5月底累計號誌變換9,540次，每趟平均節省約101秒。"], "sources": ["tyr-s21"]}, {"name": "八德派出所新廳舍", "area": "治安消防", "plain": "八德派出所原址拆除重建，新廳舍於2026年7月24日揭牌啟用，八德交通分隊同址進駐。", "facts": ["重建經費約2.8億元，可容納100名警力。"], "sources": ["tyr-s22"]}, {"name": "平鎮四里活動中心", "area": "市政效能", "plain": "平鎮新貴、北貴、北富、南勢四里聯合市民活動中心於2026年3月13日啟用，市府投入約5,000萬元。", "facts": ["張善政稱目標為「一里一空間」。"], "sources": ["tyr-s23"]}], "crossCity": [{"text": "棕線銜接新北捷運新莊線與土城樹林線，張善政稱將強化北北桃共同生活圈", "with": ["newtaipei"], "sources": ["ty-s10"]}, {"text": "與新北整合林口線及長庚線為新桃林線輕軌，目標2039年通車", "with": ["newtaipei"], "sources": ["ty-s11"]}, {"text": "主張與新竹、苗栗合作打造「桃竹苗大矽谷」，將智慧產業學院擴為區域平台", "with": ["hsinchu", "miaoli"], "sources": ["ty-s20", "ty-s21"]}, {"text": "張善政表示將與李四川持續合作，讓基北北桃比擬國際大都市", "with": ["newtaipei", "taipei", "keelung"], "sources": ["ty-s26"]}, {"text": "台北市長蔣萬安稱張善政將與新北、基隆、新竹、宜蘭參選人串聯推動六縣市合作（蔣萬安說法）", "with": ["taipei", "newtaipei", "keelung", "yilan", "hsinchu"], "sources": ["ty-s27"]}], "unknowns": ["未找到官方競選網站或完整政見白皮書；競辦稱將說明「下一階段發展方向」，但截至查核日未見逐條政見（ty-s36）", "對手為民進黨徵召的黃世杰（ty-s2、ty-s34）；公辦政見發表會或辯論內容尚未取得", "機場捷運相關的連任承諾（如延伸、增班、站點）未見張善政本人說法", "航空城：僅見張善政描述國1甲可串連周邊逾千億元投資（ty-s29）及安置住宅轉作可負擔住宅（ty-s13），未見下一任期的具體航空城政見", "鐵路地下化：未見張善政提出新的完工時程承諾，僅有施工協調措施", "托育、教育、青年、運動（除巨蛋外）未見明確屬於2026競選的新承諾，現有措施多為任內已上路政策", "市立醫院總經費來源、是否需中央分擔、各院床數與完工年份均未由張善政明確說明（ty-s15、ty-s17）", "社宅「5千多戶」與「2030年前一萬戶」兩組數字的口徑（完工或決標、統計期間）未說明", "桃小巴「持市民卡免費」是否已全面實施，及200條路線目標的最新進度未確認", "北北基桃合作未見具體跨市專案清單，北北基桃市長級會議的內容尚未取得"], "recordShown": true}], "flows": {"sources": [{"id": "fl-s1", "url": "https://news.ltn.com.tw/news/NewTaipei/breakingnews/5437743", "title": "李四川：要和蔣萬安一起 讓雙北交通進步到30分鐘生活圈", "publisher": "自由時報", "date": "2026-05-15", "checkedAt": "2026-10-22", "tier": "news"}, {"id": "fl-s2", "url": "https://udn.com/news/story/124652/9507230", "title": "打造雙北30分鐘生活圈 李四川高喊：新北要成為最有希望城市", "publisher": "聯合報", "date": "2026-05-16", "checkedAt": const S=40, SQ=Math.sqrt(3);

const ANCH={taipei:[0,0],newtaipei:[-30,40],keelung:[170,-125],taoyuan:[-235,80]};
const cells=[];for(let q=-14;q<=14;q++)for(let r=-14;r<=14;r++)cells.push([q,r]);
const used=new Map(), hexOf=new Map();
for(const c of cities){
  const [ax,ay]=ANCH[c.city];
  const n=c.themes.length;
  let placed=0;
  const pool=cells.filter(([q,r])=>!used.has(q+","+r)).map(([q,r])=>{const [x,y]=px(q,r);return{q,r,d:Math.hypot(x-ax,y-ay*1)}}).sort((a,b)=>a.d-b.d);

  const isNb=(a,b)=>{const dq=a.q-b.q,dr=a.r-b.r;return Math.abs(dq)+Math.abs(dr)+Math.abs(dq+dr)===2};
  for(const p of pool){ if(placed>=n)break; if(mine.length&&!mine.some(m=>isNb(m,p)))continue; mine.push(p);used.set(p.q+","+p.r,c.city);placed++; }
  mine.sort((a,b)=>a.r-b.r||a.q-b.q);
  c.themes.forEach((t,i)=>{hexOf.set(t.id,mine[i])});

const corner=(x,y,i)=>{const a=Math.PI/180*(60*i-30);return[x+S*Math.cos(a),y+S*Math.sin(a)]};
function wrapName(n){n=String(n);if(n.length<=5)return[n];
  const mid=n.length/2;let best=-1;
  for(let i=1;i<n.length;i++){const ch=n[i],prev=n[i-1];const ok=ch==="與"||ch==="×"||prev==="、"||ch===" ";if(ok&&(best<0||Math.abs(i-mid)<Math.abs(best-mid)))best=i}
  if(best>0&&best<=6&&n.length-best<=6)return[n.slice(0,best).trim(),n.slice(best).trim()];

function drawMap(){
  const pts=[...hexOf.values()].map(h=>px(h.q,h.r));
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  const pad=S*1.6, minx=Math.min(...xs)-pad, maxx=Math.max(...xs)+pad, miny=Math.min(...ys)-pad-18, maxy=Math.max(...ys)+pad+26;
  svg.setAttribute("viewBox",`${minx} ${miny} ${maxx-minx} ${maxy-miny}`);svg.style.setProperty("--ar",`${(maxx-minx).toFixed(0)}/${(maxy-miny).toFixed(0)}`);
  let hexes="",borders="",labels="";
  for(const t of themes){
    const h=hexOf.get(t.id),[x,y]=px(h.q,h.r);
    const poly=[0,1,2,3,4,5].map(i=>corner(x,y,i).map(v=>v.toFixed(1)).join(",")).join(" ");
    const lines=wrapName(t.name);
    const ty0=y+(lines.length>1?-1:6);
    hexes+=`<g class="hex${t.kind==="record"?" record":""}" tabindex="0" role="button" data-theme="${t.id}" data-city="${t.city}" style="${cvar(t.city)};--hatch:url(#hatch-${t.city})" aria-label="${esc(cityById.get(t.city).cityName+" "+t.name)}"><polygon points="${poly}"/><text class="code" x="${x}" y="${y-(lines.length>1?20:14)}">${CODE[t.city]}·${String(t.no).padStart(2,"0")}</text>${lines.map((l,i)=>`<text x="${x}" y="${ty0+i*14}">${esc(l)}</text>`).join("")}</g>`;
    DIRS.forEach(([dq,dr],k)=>{const nb=used.get((h.q+dq)+","+(h.r+dr));if(nb!==t.city){const[a,b]=EDGE[k];const p1=corner(x,y,a),p2=corner(x,y,b);borders+=`<line class="border" style="${cvar(t.city)}" x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}"/>`}});
  }
  // city labels: above the top-most hex of each cluster
  const cent=new Map();
  for(const c of cities){
    const hs=c.themes.map(t=>{const h=hexOf.get(t.id);return px(h.q,h.r)});
    cent.set(c.city,[hs.reduce((s,p)=>s+p[0],0)/hs.length,hs.reduce((s,p)=>s+p[1],0)/hs.length]);

    const lx=c.city==="taoyuan"?Math.min(...hs.map(p=>p[0])):top[0];
    labels+=`<text class="citylabel" style="${cvar(c.city)}" x="${lx}" y="${south?top[1]+S*1.75:top[1]-S*1.15}" text-anchor="middle">${esc(c.cityName)}<tspan class="cand" dx="6">${esc(c.candidate)}</tspan></text>`;
  }
  // flows: arcs between cluster centroids
  let fl="";const pairCount={};
  flows.forEach(f=>{
    const cs=f.cities.filter(x=>cityById.has(x)), hub=cs[0];

    }
  });
  const dots=[...cent.entries()].map(([c,[x,y]])=>`<circle class="flowdot" cx="${x}" cy="${y}" r="3"/>`).join("");
  svg.innerHTML=`<defs>${cities.map(c=>`<pattern id="hatch-${c.city}" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="var(--surface)"/><line x1="0" y1="0" x2="0" y2="7" stroke="var(--c-${c.city})" stroke-width="2.4" opacity=".3"/></pattern>`).join("")}</defs><g>${hexes}</g><g>${borders}</g><g class="flowlayer">${fl}</g><g>${labels}</g>`;
  $$(".hex").forEach(g=>{g.onclick=()=>openTheme(g.dataset.theme);g.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openTheme(g.dataset.theme)}}});
  $$("[data-flow]").forEach(g=>g.onclick=()=>openFlow(g.dataset.flow));
}

    g.classList.toggle("sel",t.id===selTheme);
    let dim=!!cityFilter&&t.city!==cityFilter;
    if(selFlow){const f=flows.find(x=>x.id===selFlow);dim=!f.cities.includes(t.city)}
    g.classList.toggle("dim",dim);
    g.classList.toggle("hit",!!query&&matches(t));
  });
  $$("[data-flow]").forEach(g=>{
    const f=flows.find(x=>x.id===g.dataset.flow);
    const on=selFlow===f.id||(!!selTheme&&f.cities.includes(themeById.get(selTheme).city)&&!selFlow&&false);
    g.querySelector(".flow").classList.toggle("on",on);g.classList.toggle("picked",on);
    g.style.display=cityFilter&&!f.cities.includes(cityFilter)?"none":"";
  });
  $$("[data-city]").forEach(b=>{if(b.classList.contains("chip"))b.setAttribute("aria-pressed",String(b.dataset.city===cityFilter))});
  window.MAP3D&&window.MAP3D.paint();
}
const matches=t=>{const q=query.toLowerCase();return JSON.stringify([t.name,t.summary,(t.items||[]).map(i=>[i.name,i.plain,i.facts])]).toLowerCase().includes(q)};

/* ---------- panel views ---------- */
const body=$("#pbody");
function show(html){body.innerHTML=html;body.scrollTop=0;
  body.querySelectorAll("[data-open-theme]").forEach(b=>b.onclick=()=>openTheme(b.dataset.openTheme));
  body.querySelectorAll("[data-open-item]").forEach(b=>b.onclick=()=>openItem(b.dataset.openItem));
  body.querySelectorAll("[data-open-flow]").forEach(b=>b.onclick=()=>openFlow(b.dataset.openFlow));
  body.querySelectorAll("[data-open-city]").forEach(b=>b.onclick=()=>{setCity(b.dataset.openCity);setTab("list")});
  body.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>{selTheme=null;selFlow=null;selItem=null;paint();window.MAP3D&&window.MAP3D.home();setTab(tab)});
}
function srcList(ids){
  const u=[...new Set(ids||[])].map(id=>sources.get(id)).filter(s=>s&&s.url);
  if(!u.length)return`<p class="empty">此項未附可連結的來源。</p>`;
  return`<div class="src">${u.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title||s.url)}<small>${esc([s.publisher,s.date,TIER[s.tier]].filter(Boolean).join(" · "))}</small></a>`).join("")}</div>`;
}
const tierOf=ids=>{const ts=(ids||[]).map(i=>sources.get(i)?.tier).filter(Boolean);return ts.includes("official")?"official":ts.includes("news")?"news":ts[0]};
function viewCands(){
  return`<div class="eyebrow">2026 縣市長選舉 · 北北基桃</div><h2 class="title">四位參選人</h2>
  <p class="lede">點地圖上的格子，或從這裡進入各城市的政策主題。每一項內容都附上原始來源連結。</p>
  <div class="cands">${cities.map(c=>{const pol=c.themes.filter(t=>t.kind!=="record"),recs=c.themes.filter(t=>t.kind==="record"),rec=recs.length?{items:recs.flatMap(t=>t.items)}:null;const n=pol.reduce((s,t)=>s+(t.items||[]).length,0);const fc=flows.filter(f=>f.cities.includes(c.city)).length;
    return`<button class="cand" style="${cvar(c.city)}" data-open-city="${c.city}"><span class="cn">${esc(c.candidate)}</span><span class="ct">${esc(c.cityName)}・${esc(c.status||"")}${c.slogan?`<br>主軸：${esc(c.slogan)}`:""}</span><span class="stats">${pol.length} 個主題 ／ ${n} 項政見${rec?` ／ ${rec.items.length} 項政績`:""} ／ ${fc} 條跨市協作</span></button>`}).join("")}</div>`;
}
function viewList(){
  const q=query.toLowerCase();
  const groups=cities.filter(c=>!cityFilter||c.city===cityFilter).map(c=>{
    const ts=c.themes.filter(t=>!q||matches(t));
    if(!ts.length)return"";
    return`<h3 class="sec" style="${cvar(c.city)};margin-top:8px"><span class="dots"><i></i></span> ${esc(c.cityName)}・${esc(c.candidate)}</h3>`+ts.map(t=>{
      const its=(t.items||[]).filter(i=>!q||JSON.stringify([i.name,i.plain,i.facts,t.name]).toLowerCase().includes(q));
      return`<details class="grp" style="${cvar(c.city)}" ${q?"open":""}><summary><i></i>${esc(t.name)}<span class="cnt">${its.length}</span></summary><div class="rows"><button class="row" data-open-theme="${t.id}"><span class="no">${CODE[c.city]}</span><span class="nm">看這個主題</span><span class="go">›</span></button>${its.map(i=>`<button class="row" data-open-item="${i.id}"><span class="no">${String(t.no).padStart(2,"0")}.${i.no}</span><span class="nm">${esc(i.name)}</span><span class="go">›</span></button>`).join("")}</div></details>`}).join("")
    +((c.achievements||[]).length&&!q&&!c.recordShown?`<details class="grp ach" style="${cvar(c.city)}"><summary><i style="background:none;border:2px solid var(--c)"></i>任內已實施（參考，不列入地圖）<span class="cnt">${c.achievements.length}</span></summary><ul class="facts" style="padding:4px 0 12px 2.2em">${c.achievements.map(a=>`<li><b>${esc(a.name)}</b>${a.plain?`：${esc(a.plain)}`:""}</li>`).join("")}</ul></details>`:"");
  }).join("");
  return`<input class="search" id="q" type="search" placeholder="搜尋政見，例如 捷運、托育、長照" value="${esc(query)}" aria-label="搜尋政見">${groups||`<p class="empty">沒有符合「${esc(query)}」的政見。</p>`}`;
}
function viewFlows(){
  return`<div class="eyebrow">Cross-city</div><h2 class="title">跨市協作</h2><p class="lede">參選人公開提到、需要兩個以上城市一起推動的計畫。地圖上的紅線連接相關城市；線型代表依據來源。</p>
  ${flows.filter(f=>!cityFilter||f.cities.includes(cityFilter)).map(f=>`<button class="flowitem" data-open-flow="${esc(f.id)}"><b>${esc(f.id)}</b>${esc(f.title)}<span class="sub">${f.cities.map(c=>cityById.get(c)?.cityName||c).join(" ↔ ")}・${TIER[f.tier]||""}</span></button>`).join("")||`<p class="empty">目前沒有整理到跨市協作。</p>`}`;
}
function viewAbout(){
  return`<div class="method"><div class="eyebrow">Method</div><h2 class="title">資料怎麼來的</h2>
  <p>這是一份獨立整理的政見索引，不代表任何候選人、政黨或競選團隊，也沒有接受其委託。內容只收錄公開來源中明確提到的政見，以白話改寫，不加評價。</p>
  <p>每一項都標示依據：<b>官方發布</b>指候選人或競選團隊自己的網站、社群或記者會資料；<b>媒體報導</b>指新聞對其政見發表的報導；<b>受訪發言</b>指訪談或辯論中的說法。數字、時程與金額只在來源有寫時列出。</p>
  <p>資料查核日期：${esc(D.meta.checkedAt)}。選舉期間政見仍可能增修，請以候選人最新公開資訊為準。</p>

  <h3 class="sec">來源數</h3><p>${sources.size} 個公開來源</p></div>`;
}
function openTheme(id){
  const t=themeById.get(id);if(!t)return;const c=cityById.get(t.city);
  selTheme=id;selFlow=null;selItem=null;paint();window.MAP3D&&window.MAP3D.focusTheme(id);
  const fl=flows.filter(f=>f.cities.includes(t.city));
  show(`<button class="back" data-back>← 返回</button><div style="${cvar(t.city)}"><div class="eyebrow">${CODE[t.city]}·${String(t.no).padStart(2,"0")} · ${esc(c.cityName)} · ${esc(c.candidate)}</div><h2 class="title">${esc(t.name)}</h2>
  ${t.summary?`<p class="lede">${esc(t.summary)}</p>`:""}${t.vision?`<div class="vision">${esc(t.vision)}</div>`:""}
  <div class="pills"><span class="pill city">${esc(c.cityName)}</span><span class="pill">${(t.items||[]).length} 項${t.kind==="record"?"已實施施政":"政見"}</span></div>
  ${(()=>{const row=i=>`<button class="row" data-open-item="${i.id}"><span class="no">${String(t.no).padStart(2,"0")}.${i.no}</span><span class="nm">${esc(i.name)}${i.who?`<span class="sub">對象：${esc(i.who)}</span>`:""}</span><span class="go">›</span></button>`;
    if(t.kind!=="record")return`<h3 class="sec">政見細項</h3><div class="rows">${(t.items||[]).map(row).join("")}</div>`;
    const g=new Map();for(const i of t.items||[]){const k=i.area||"其他";if(!g.has(k))g.set(k,[]);g.get(k).push(i)}
    return[...g.entries()].map(([k,v])=>`<h3 class="sec">${esc(k)}<span style="font-family:var(--f-mono);font-weight:400;margin-left:6px">${v.length}</span></h3><div class="rows">${v.map(row).join("")}</div>`).join("")})()}
  ${fl.length?`<h3 class="sec">${esc(c.cityName)}參與的跨市協作</h3>${fl.map(f=>`<button class="flowitem" data-open-flow="${esc(f.id)}"><b>${esc(f.id)}</b>${esc(f.title)}<span class="sub">${f.cities.map(x=>cityById.get(x)?.cityName||x).join(" ↔ ")}</span></button>`).join("")}`:""}
  <h3 class="sec">來源</h3>${srcList([...(t.sources||[]),...(t.items||[]).flatMap(i=>i.sources||[])])}</div>`);
}
function openItem(id){
  const i=items.get(id);if(!i)return;const t=themeById.get(i.theme),c=cityById.get(i.city);
  selTheme=t.id;selFlow=null;selItem=id;paint();window.MAP3D&&window.MAP3D.focusItem(id);
  const tier=tierOf(i.sources);
  show(`<button class="back" data-open-theme="${t.id}">← ${esc(t.name)}</button><div style="${cvar(i.city)}"><div class="eyebrow">${CODE[i.city]}·${String(t.no).padStart(2,"0")}.${i.no} · ${esc(c.candidate)} · ${esc(t.name)}</div><h2 class="title">${esc(i.name)}</h2>
  <div class="pills"><span class="pill city">${esc(c.cityName)}</span>${tier?`<span class="pill t-${tier}">${TIER[tier]}</span>`:""}${(i.tags||[]).map(x=>`<span class="pill">${esc(x)}</span>`).join("")}</div>
  ${i.plain?`<p class="lede">${esc(i.plain)}</p>`:""}
  <dl class="kv">${i.who?`<dt>對象</dt><dd>${esc(i.who)}</dd>`:""}${i.phase?`<dt>時程</dt><dd>${esc(i.phase)}</dd>`:""}</dl>
  ${(i.facts||[]).length?`<h3 class="sec">重點</h3><ul class="facts">${i.facts.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>`:""}
  <h3 class="sec">來源</h3>${srcList(i.sources)}</div>`);
}
function openFlow(id){
  const f=flows.find(x=>x.id===id);if(!f)return;
  selFlow=id;selTheme=null;selItem=null;paint();window.MAP3D&&window.MAP3D.focusFlow(id);
  show(`<button class="back" data-back>← 返回</button><div class="eyebrow">跨市協作 ${esc(f.id)}</div><h2 class="title">${esc(f.title)}</h2>
  <div class="pills">${f.cities.map(c=>`<span class="pill city" style="${cvar(c)}">${esc(cityById.get(c)?.cityName||c)}</span>`).join("")}<span class="pill t-${esc(f.tier)}">${TIER[f.tier]||""}</span></div>
  <p class="lede">${esc(f.text)}</p>
  <dl class="kv">${(f.proposedBy||[]).length?`<dt>提出者</dt><dd>${esc(f.proposedBy.join("、"))}</dd>`:""}${f.carry?`<dt>流動的是</dt><dd>${esc(f.carry)}</dd>`:""}</dl>
  ${f.quote?`<div class="vision quote">「${esc(f.quote)}」${f.quoteBy?`<small style="display:block;font-family:var(--f-body);font-weight:400;font-size:12.5px;color:var(--muted)">— ${esc(f.quoteBy)}</small>`:""}</div>`:""}
  <h3 class="sec">來源</h3>${srcList(f.sources)}`);
}
function setTab(t){tab=t;$$(".tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===t)));
  show({cands:viewCands,list:viewList,flows:viewFlows,about:viewAbout}[t]());
  const q=$("#q");if(q){q.oninput=e=>{query=e.target.value;const pos=e.target.selectionStart;paint();setTab("list");const n=$("#q");n.focus();n.setSelectionRange(pos,pos)}}
}
function setCity(c){cityFilter=c;selFlow=null;paint();if(tab==="list"||tab==="flows")setTab(tab)}
$$(".tabs button").forEach(b=>b.onclick=()=>{selTheme=null;selFlow=null;paint();setTab(b.dataset.tab)});
$("#citychips").innerHTML=cities.map(c=>`<button class="chip" data-city="${c.city}" style="${cvar(c.city)}" aria-pressed="false"><i></i>${esc(c.cityName)}</button>`).join("");
$$(".chip[data-city]").forEach(b=>b.onclick=()=>setCity(b.dataset.city));
$("#toggleflows").onclick=e=>{const on=e.currentTarget.getAttribute("aria-pressed")!=="true";e.currentTarget.setAttribute("aria-pressed",String(on));e.currentTarget.textContent=on?"隱藏跨市協作線":"顯示跨市協作線";$("#mapwrap").classList.toggle("flows-off",!on);paint()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&(selTheme||selFlow)){selTheme=null;selFlow=null;selItem=null;paint();window.MAP3D&&window.MAP3D.home();setTab(tab)}});
if(svg)drawMap();
window.APP={D,cities,cityById,themes,themeById,items,flows,hexOf,used,px,S,CODE,wrapName,openTheme,openItem,openFlow,setTab,setCity,
  get state(){return{cityFilter,selTheme,selFlow,selItem,query,tab,flowsOn:!$("#mapwrap").classList.contains("flows-off")}},matches};
paint();setTab("cands");
const h=location.hash.slice(1);
if(h){if(themeById.has(h))openTheme(h);else if(items.has(h))openItem(h);else if(cityById.has(h)){setCity(h);setTab("list")}}
</script>
