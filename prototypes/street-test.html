<body>
<main id="scene" aria-label="可拖曳旋轉與縮放的臺北街景 3D 測試"></main>
<header class="top"><div class="identity"><div class="eyebrow">TPENCORE · STREET STUDY 01</div><h1>臺北，一個生活街角。</h1><p>草地・自然樹群・托育街景</p></div><div class="settings"><select class="quality" id="quality" aria-label="畫質"><option value="high">高畫質</option><option value="standard">標準畫質</option></select><a class="back" href="https://tpencore.tw/">返回政策城市 ↗</a></div></header>
<div class="note">即時 3D 美術測試 · 場景為虛構配置</div>
<div class="hint">拖曳旋轉 · 滾輪縮放 · 右鍵平移<br>觸控：單指旋轉 · 雙指縮放／平移<br>點選街上的藍衣人物</div>
<footer class="bottom"><div class="description"><strong>讓空地，也成為城市的一部分。</strong><p>不規則草坪與疏密樹群，銜接街道、建築與日常生活。<br><span id="stats">Three.js · WebGL 即時渲染</span></p></div><nav class="controls" aria-label="觀察視角"><button data-view="overview" aria-pressed="true">街區總覽</button><button data-view="street" aria-pressed="false">街道近景</button><button data-view="garden" aria-pressed="false">草地樹群</button></nav><div class="controls light" role="group" aria-label="光照時間"><button data-light="day" aria-pressed="true">白天</button><button data-light="sunset" aria-pressed="false">夕陽</button></div></footer>
<aside id="toast" hidden aria-label="人物說明"><button id="close-toast" aria-label="關閉">×</button><strong>你好，我是城市旅人。</strong><p>這裡先測試人物、街景與光影。你可以靠近、旋轉觀察，任務玩法尚未加入。</p></aside>
<div id="loading" role="status"><strong>正在搭建這個街角</strong><p id="loading-text">載入 3D 場景、草地與植栽…</p><button id="retry" hidden>重新載入</button></div>
<script type="module">
